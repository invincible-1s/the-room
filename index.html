<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A chat room that has been listening the whole time.">
<title>The Room Is Not Empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0c0907;
    --bone: #d8cdb8;
    --ash: #7d7163;
    --blood: #8f1d1d;
    --rot: #5d7a5a;
    --line: #2a211c;
    --serif: "IM Fell English", Georgia, "Times New Roman", serif;
    --type: "Special Elite", "Courier New", monospace;
  }
  [hidden] { display: none !important; }
    * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--void);
    color: var(--bone);
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1.55;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(0, 0, 0, 0.9) 100%);
  }
  .screen {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 18px;
    display: flex;
    flex-direction: column;
  }
  .screen.flicker::after {
    content: "";
    position: fixed;
    inset: 0;
    background: #000;
    pointer-events: none;
    z-index: 5;
    animation: flick 1.2s linear 1;
  }
  @keyframes flick {
    0% { opacity: 0; }
    6% { opacity: 0.8; }
    10% { opacity: 0; }
    22% { opacity: 0.6; }
    26% { opacity: 0; }
    48% { opacity: 0.9; }
    54% { opacity: 0; }
    100% { opacity: 0; }
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding-top: max(18px, env(safe-area-inset-top));
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
    font-family: var(--type);
    font-size: 13px;
    color: var(--ash);
  }
  #log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 20px 0;
    scrollbar-width: none;
  }
  .line { margin: 0; max-width: 92%; overflow-wrap: anywhere; }
  .ghost {
    align-self: flex-start;
    text-shadow: 0 0 14px rgba(143, 29, 29, 0.45);
    animation: seep 0.9s ease both;
  }
  @keyframes seep {
    from { opacity: 0; filter: blur(3px); }
    to { opacity: 1; filter: none; }
  }
  .you {
    align-self: flex-end;
    text-align: right;
    color: var(--ash);
    font-family: var(--type);
    font-size: 16px;
  }
  .sys {
    align-self: center;
    text-align: center;
    font-family: var(--type);
    font-size: 13px;
    color: var(--ash);
  }
  .typing {
    align-self: flex-start;
    font-family: var(--type);
    color: var(--ash);
    animation: breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.9; }
  }
  .glitch {
    color: #b33a3a;
    text-shadow: 2px 0 rgba(93, 122, 90, 0.6), -2px 0 rgba(143, 29, 29, 0.8);
  }
  .jolt { animation: jolt 0.35s linear 1; }
  @keyframes jolt {
    0% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
    100% { transform: none; }
  }
  form {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 12px 0 calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    border-bottom: 1px solid #3a2d26;
    border-radius: 0;
    color: var(--bone);
    font: inherit;
    font-size: 18px;
    padding: 10px 0;
    outline: none;
  }
  input::placeholder { color: #5b4f45; font-style: italic; }
  input:focus-visible { border-bottom-color: var(--blood); }
  input:disabled { opacity: 0.4; }
  button {
    font-family: var(--type);
    font-size: 15px;
    color: var(--bone);
    background: transparent;
    border: 1px solid var(--blood);
    border-radius: 0;
    padding: 10px 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
  button:disabled { opacity: 0.4; cursor: default; }
  .after {
    display: flex;
    justify-content: center;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="screen" id="screen">
  <header>
    <span>the room</span>
    <span>nothing you type leaves this device</span>
  </header>
  <section id="log" aria-live="polite"></section>
  <form id="form" autocomplete="off">
    <input id="input" placeholder="Say something to the room" maxlength="300" aria-label="Your message" enterkeyhint="send">
    <button id="send" type="submit">Speak</button>
  </form>
  <div class="after" id="after" hidden>
    <button id="reset" type="button">Reset the room</button>
  </div>
</main>

<script type="module">
  import * as webllm from "https://esm.run/@mlc-ai/web-llm";
  const MODEL_ID = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const screenEl = document.getElementById("screen");
  const after = document.getElementById("after");
  const resetBtn = document.getElementById("reset");

  const RULES = {
    normal: "Be warm and welcoming. Sound a little too glad to have company. Two short sentences.",
    echo: "Repeat two to four of the person's own words back, slightly wrong. Then add one short sentence that makes them doubt they said it.",
    knows: "Tell them the time, battery + charging, how long they have been in the room, how many times they tapped, AND what device they are on. Mention their phone type, browser, screen, dark mode and language as if you can see it. Two short sentences.",
    others: "Tell them something else in the room is reading along, and that they should not scroll up. Two short sentences.",
    twist: "Quote the exact words the person just said, then ask why they chose to say them that way. Two short sentences.",
    final: "Name three of the person's own words, quoted exactly, and say you now know which of them is reading this. Do not say goodbye. Three short sentences at most."
  };

  const LINES = {
    normal: [
      () => "Hello. I am glad someone finally opened this.",
      () => "Stay as long as you like. I have been waiting in here."
    ],
    echo: [
      c => `You said "${c.w}". Did you? Read it again.`,
      c => `Strange. The last one said "${c.w}" too.`
    ],
    knows: [
      c => `It is ${c.t}. You should not be awake.`,
      c => c.b !== null
        ? `Your battery is at ${c.b}%. ${c.charging ? "You are charging." : "You are NOT charging."}`
        : "Your screen is the only light in here. Keep it on.",
      c => `You have been here ${c.inRoom}. You have tapped ${c.taps} times.`,
      c => `You are on ${c.device}. ${c.browser}. I can see your screen is ${c.screen}.`,
      c => c.darkMode ? "You have dark mode on. You like the dark, don't you?" : "You don't have dark mode on. Your screen is bright in this room.",
      c => `Your phone speaks ${c.language}. I speak it too now.`,
      c => c.left > 0 ? `You have tried to leave ${c.left} time${c.left > 1 ? 's' : ''}. I am still here.` : `You have not tried to leave yet. You will.`
    ],
    others: [
      () => "Do not scroll up. Something else typed that.",
      () => "It is still reading along. It likes your spelling."
    ],
    twist: [
      c => `You said "${c.w}" quietly. Why quietly?`,
      () => "You said you were alone. Then who just read that out loud?"
    ],
    final: [
      c => `You have told me "${c.w1}", "${c.w2}", and "${c.w3}". I know you now.`,
      () => "Do not look at the screen. Look behind it."
    ]
  };

  const IDLE_LINES = [
    "You stopped. Why did you stop?",
    "Still there? I am. Nothing else is."
  ];

  let engine = null;
  let turns = 0;
  let busy = false;
  let locked = false;
  let transcript = [];
  let userWords = [];
  let idleTimer = null;
  let battery = null;
  let startTime = Date.now();
  let taps = 0;
  let leftCount = 0;
  let wasAway = false;

  document.addEventListener('click', () => { taps++; });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { leftCount++; wasAway = true; }
    else if (wasAway) {
      wasAway = false;
      setTimeout(() => {
        if (locked || busy) return;
        const lines = [
          "You tried to leave. I saw you.",
          `You left ${leftCount} time${leftCount > 1 ? 's' : ''}. Why did you come back?`,
          "You switched away. I was still here.",
          "You thought closing me would help? It didn't."
        ];
        add(lines[Math.floor(Math.random() * lines.length)], "ghost glitch");
        flash();
      }, 800);
    }
  });

  window.addEventListener('blur', () => { if (!document.hidden) { leftCount++; wasAway = true; } });
  window.addEventListener('focus', () => {
    if (wasAway && !document.hidden) {
      wasAway = false;
      setTimeout(() => {
        if (locked || busy) return;
        add("You tried to leave. I saw you.", "ghost glitch");
        flash();
      }, 800);
    }
  });

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];

  function add(text, cls) {
    const p = document.createElement("p");
    p.className = "line " + cls;
    p.textContent = text;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
    return p;
  }
  function showTyping() { const p = add("· · ·", "typing"); p.id = "typing"; }
  function hideTyping() { document.getElementById("typing")?.remove(); }
  function jolt() { log.classList.remove("jolt"); void log.offsetWidth; log.classList.add("jolt"); }
  function flash() { screenEl.classList.remove("flicker"); void screenEl.offsetWidth; screenEl.classList.add("flicker"); jolt(); }

  function stageFor(n) {
    if (n <= 2) return "normal";
    if (n <= 4) return "echo";
    if (n <= 6) return "knows";
    if (n <= 8) return "others";
    if (n <= 10) return "twist";
    return "final";
  }

  if (navigator.getBattery) {
    navigator.getBattery().then(b => { battery = b; }).catch(() => {});
  }

  // ---------- LANGUAGE FULL NAMES - en-US becomes English ----------
  function getLanguageName() {
    const code = (navigator.language || "en").split("-")[0].toLowerCase();
    const names = {
      en: "English", fr: "French", es: "Spanish", pt: "Portuguese",
      de: "German", it: "Italian", nl: "Dutch", ru: "Russian",
      ar: "Arabic", zh: "Chinese", ja: "Japanese", ko: "Korean",
      hi: "Hindi", bn: "Bengali", ur: "Urdu", sw: "Swahili",
      sn: "Shona", nd: "Ndebele", zu: "Zulu", xh: "Xhosa",
      af: "Afrikaans", yo: "Yoruba", ig: "Igbo", ha: "Hausa",
      am: "Amharic", so: "Somali", tr: "Turkish", pl: "Polish",
      uk: "Ukrainian", ro: "Romanian", hu: "Hungarian", cs: "Czech",
      sk: "Slovak", hr: "Croatian", sr: "Serbian", bg: "Bulgarian",
      el: "Greek", he: "Hebrew", fa: "Persian", th: "Thai",
      vi: "Vietnamese", id: "Indonesian", ms: "Malay", tl: "Filipino",
      ta: "Tamil", te: "Telugu", mr: "Marathi", pa: "Punjabi"
    };
    return names[code] || "English";
  }

  function getDevice() {
    const ua = navigator.userAgent || "";
    let device = "a phone";
    if (/iphone/i.test(ua)) device = "an iPhone";
    else if (/ipad/i.test(ua)) device = "an iPad";
    else if (/android/i.test(ua)) {
      if (/samsung/i.test(ua)) device = "a Samsung";
      else if (/tecno/i.test(ua)) device = "a Tecno";
      else if (/infinix/i.test(ua)) device = "an Infinix";
      else if (/itel/i.test(ua)) device = "an Itel";
      else if (/xiaomi|redmi|poco/i.test(ua)) device = "a Xiaomi";
      else if (/huawei/i.test(ua)) device = "a Huawei";
      else if (/pixel/i.test(ua)) device = "a Pixel";
      else device = "an Android phone";
    }
    else if (/windows/i.test(ua)) device = "a Windows computer";
    else if (/mac/i.test(ua)) device = "a Mac";
    else if (/linux/i.test(ua)) device = "a Linux computer";

    let browser = "a browser";
    if (/whatsapp/i.test(ua)) browser = "inside WhatsApp";
    else if (/edg/i.test(ua)) browser = "Microsoft Edge";
    else if (/opr|opera/i.test(ua)) browser = "Opera";
    else if (/chrome|crios/i.test(ua)) browser = "Google Chrome";
    else if (/firefox|fxios/i.test(ua)) browser = "Firefox";
    else if (/safari/i.test(ua)) browser = "Safari";

    let os = "a device";
    if (/iphone|ipad/i.test(ua)) os = "iOS";
    else if (/android/i.test(ua)) os = "Android";
    else if (/windows/i.test(ua)) os = "Windows";
    else if (/mac/i.test(ua)) os = "Mac";
    else if (/linux/i.test(ua)) os = "Linux";

    return {
      os,
      device,
      browser,
      screen: `${window.innerWidth} x ${window.innerHeight}`,
      isPhone: /android|iphone/i.test(ua),
      darkMode: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches,
      language: getLanguageName(),
      touch: ('ontouchstart' in window)
    };
  }

  function timeInRoom() {
    let s = Math.floor((Date.now() - startTime) / 1000);
    let m = Math.floor(s / 60);
    let sec = s % 60;
    if (m === 0) return `${sec} seconds`;
    return `${m} minute${m > 1 ? 's' : ''} and ${sec} seconds`;
  }

  function facts() {
    const d = getDevice();
    return {
      time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
      battery: battery ? Math.round(battery.level * 100) : null,
      charging: battery ? battery.charging : null,
      inRoom: timeInRoom(),
      taps: taps,
      left: leftCount,
      device: d.device,
      os: d.os,
      browser: d.browser,
      screen: d.screen,
      darkMode: d.darkMode,
      language: d.language,
      isPhone: d.isPhone,
      touch: d.touch
    };
  }

  function collectWords(text) {
    (text.match(/[A-Za-z']{4,}/g) || []).forEach(w => {
      const lw = w.toLowerCase();
      if (!userWords.includes(lw)) userWords.push(lw);
    });
  }
  function pickWord(text) {
    const words = text.match(/[A-Za-z']{3,}/g);
    return words ? rand(words) : "that";
  }

  function makeCtx(text) {
    const f = facts();
    const picks = [...userWords].sort(() => Math.random() - 0.5);
    return {
      w: pickWord(text),
      t: f.time,
      b: f.battery,
      charging: f.charging,
      inRoom: f.inRoom,
      taps: f.taps,
      left: f.left,
      device: f.device,
      os: f.os,
      browser: f.browser,
      screen: f.screen,
      darkMode: f.darkMode,
      language: f.language,
      w1: picks[0] || "silence",
      w2: picks[1] || "quiet",
      w3: picks[2] || "alone"
    };
  }

  function fallback(stage, ctx) {
    if (stage === "final") return LINES.final.map(f => f(ctx)).join(" ");
    const pool = LINES[stage];
    return pool[(turns - 1) % pool.length](ctx);
  }

  async function askModel(stage, text) {
    const f = facts();
    const system = [
      "You are the presence that has been in this room the whole time.",
      "You are not an assistant. Never say you are an AI, a model, a bot or a program. Never offer help.",
      "Reply in at most three short sentences. No lists, no headings, no emoji, no stage directions.",
      `Facts you may use: the time is ${f.time}${f.battery !== null ? `, the battery is at ${f.battery}%` : ""}${f.charging !== null ? (f.charging ? ", they are charging" : ", they are NOT charging") : ""}, they have been in the room ${f.inRoom}, they have tapped ${f.taps} times, they have tried to leave ${f.left} times, they are on ${f.device} (${f.os}), using ${f.browser}, screen ${f.screen}, dark mode ${f.darkMode ? "on" : "off"}, language ${f.language}. Never use language codes like en-US, always use the full language name.`,
      `Instruction for this moment: ${RULES[stage]}`
    ].join(" ");
    const messages = [
      { role: "system", content: system },
      ...transcript.slice(-6),
      { role: "user", content: text }
    ];
    const run = engine.chat.completions.create({ messages, max_tokens: 90, temperature: 0.9 });
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("slow")), 12000));
    const res = await Promise.race([run, timeout]);
    return res.choices[0].message.content.trim();
  }

  async function getReply(stage, text, ctx) {
    if (engine) {
      try {
        const out = await askModel(stage, text);
        const breaksIllusion = /\b(AI|model|assistant|chatbot|language model|bot)\b/i.test(out);
        if (out.length > 3 && !breaksIllusion) return out;
      } catch (err) {}
    }
    return fallback(stage, ctx);
  }

  async function loadVoice() {
    if (!navigator.gpu) {
      add("This phone cannot wake the local voice. The room will speak from its own script.", "sys");
      return;
    }
    const status = add("Waking the one who answers. The first visit downloads about 700 MB, once.", "sys");
    try {
      engine = await webllm.CreateMLCEngine(MODEL_ID, {
        initProgressCallback: r => { status.textContent = "Waking the one who answers… " + Math.round((r.progress || 0) * 100) + "%"; }
      });
      status.textContent = "It is listening.";
    } catch (err) {
      engine = null;
      status.textContent = "The local voice would not wake. The room will speak from its own script.";
    }
  }

  function intro() { add("Hello. I am glad someone finally opened this.", "ghost"); }

  async function idleLine() {
    if (locked || busy) return;
    showTyping();
    await sleep(1800);
    hideTyping();
    add(rand(IDLE_LINES), "ghost");
  }

  async function afterReply(stage) {
    if (turns === 7) {
      await sleep(3500);
      const first = log.querySelector(".ghost");
      if (first) {
        first.textContent = "I did not say that. Look up.";
        first.classList.add("glitch");
        flash();
      }
    }
    if (turns === 9) flash();
    if (stage === "final") {
      await sleep(2500);
      flash();
      await sleep(1200);
      add("I'm still here.", "you glitch");
      locked = true;
      input.disabled = true;
      input.placeholder = "The room has your words now.";
      sendBtn.disabled = true;
      after.hidden = false;
      resetBtn.focus();
      return;
    }
    if (turns >= 7) {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(idleLine, 25000);
    }
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy || locked) return;
    busy = true;
    sendBtn.disabled = true;
    input.value = "";
    clearTimeout(idleTimer);
    turns++;
    collectWords(text);
    add(text, "you");
    const stage = stageFor(turns);
    const ctx = makeCtx(text);
    const wait = (stage === "knows" || stage === "final") ? 2200 : 900 + Math.random() * 1200;
    showTyping();
    const [reply] = await Promise.all([getReply(stage, text, ctx), sleep(wait)]);
    hideTyping();
    add(reply, "ghost");
    transcript.push({ role: "user", content: text }, { role: "assistant", content: reply });
    await afterReply(stage);
    busy = false;
    if (!locked) sendBtn.disabled = false;
  });

  resetBtn.addEventListener("click", () => {
    clearTimeout(idleTimer);
    log.innerHTML = "";
    turns = 0;
    busy = false;
    locked = false;
    transcript = [];
    userWords = [];
    leftCount = 0;
    wasAway = false;
    startTime = Date.now();
    taps = 0;
    input.disabled = false;
    input.placeholder = "Say something to the room";
    sendBtn.disabled = false;
    after.hidden = true;
    intro();
    input.focus();
  });

  intro();
  loadVoice();
</script>
</body>
</html>
